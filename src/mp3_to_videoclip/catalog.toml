unlocks = ["writer", "editor", "critic"]

[[providers]]
id = "runware"
label = "Runware"
kind = "runware"
key_setting = "keys.runware"
env_var = "PROJECT_VEIL_RUNWARE_API"
lists_models = true
unlocks = ["pictures", "clips", "voices", "sounds"]

[[providers]]
id = "elevenlabs"
label = "ElevenLabs"
kind = "elevenlabs"
key_setting = "keys.elevenlabs"
env_var = "ELEVENLABS_API_KEY"
lists_models = true
only_with_key = true
unlocks = ["voices"]

[[models]]
id = "gpt-6-luna"
provider = "opencode-go"
label = "GPT-6 Luna"
capabilities = ["text", "vision"]
recommended = ["writer", "editor", "critic"]
price = { amount = "0.0001", unit = "1k_tokens_in" }
price_out = { amount = "0.0005", unit = "1k_tokens_out" }
price_note = "Up to 272K tokens of context; above that the rates double. Drawn from the Go plan's dollar allowance; cached reads are cheaper and counted at the full rate."
price_source = "https://opencode.ai/docs/go/"
price_checked = "2026-11-03"

