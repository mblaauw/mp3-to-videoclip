<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film primitives — 2 second samples</title>
    <style>
      :root { color-scheme: dark; --ink: #f4f1e8; --muted: #9aa7ad; --line: #27333a; --accent: #d8ff3e; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; background: #0b1015; color: var(--ink); font: 16px/1.5 "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      h1 { font-size: clamp(32px, 5vw, 64px); letter-spacing: -0.03em; margin: 0 0 8px; }
      h2 { font-size: 20px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin: 40px 0 16px; }
      p { color: var(--muted); max-width: 70ch; }
      section + section { border-top: 1px solid var(--line); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
      figure { margin: 0; border: 1px solid var(--line); background: #101820; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
      figcaption { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; }
      strong { font-size: 14px; text-transform: capitalize; }
      code { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Film primitives</h1>
    <p>Two-second samples rendered through the production <code>BaseFilm</code> and <code>timing.mjs</code>, so the MP4 and Studio Player share these exact primitives. 21 clips at 24 fps. <a href="contact-sheet.png">Contact sheet</a>.</p>
      <section>
        <h2>Transitions</h2>
        <div class="grid">
        <figure>
          <video src="transition-dip-to-black.mp4" controls loop muted playsinline preload="metadata"></video>
          <figcaption><strong>dip to black</strong><code>transition-dip-to-black</code></figcaption>
        </figure>
        <figure>
          <video src="transition-dip-to-white.mp4" controls loop muted playsinline preload="metadata"></video>

        <figure>

        <figure>

        </figure>
        <figure>
          <video src="transition-slide.mp4" controls loop muted playsinline preload="metadata"></video>

        </div>
      </section>
