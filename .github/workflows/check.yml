name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Install browser test runtime
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Browser regressions
        run: uv run --with playwright pytest tests/test_studio_browser.py -q
