name: check

on:
  push:
    branches: [main]
    paths-ignore: &text-only
      - "docs/**"
      - ".opencode/**"
      - "README.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore: *text-only

# A newer push replaces a PR's run; every commit on main keeps its own.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pinned static ffmpeg from a dated BtbN release, checked against the release's own
# checksum file. The apt mirror stalled whole jobs past their limit; GitHub's release
# files arrive in seconds. Move all three lines together when taking a newer build.
env:
  FFMPEG_TAG: autobuild-2026-11-05-12-48
  FFMPEG_ASSET: ffmpeg-n8.1.3-34-ga35157abb9-linux64-gpl-8.1.tar.xz
  FFMPEG_SHA256: 1bbd8ff31a24ecbe0714f21e47cc0c4382cc51340c32d5d35fc6fda44e168ab5

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync dependencies
        run: uv sync --frozen
      - &ffmpeg
        name: Install ffmpeg
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_ASSET"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg"
          build="${FFMPEG_ASSET%.tar.xz}"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 \
            "$build/bin/ffmpeg" "$build/bin/ffprobe"
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/ffmpeg" -version | head -1
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q -n auto
      - name: Test the old compositor
        run: uv run pytest -q -n auto -m slow
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Frontend install
        run: npm ci --prefix frontend
      - name: Frontend tests and build
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
      - name: Committed frontend build is current
        run: git diff --exit-code --stat -- frontend/dist
      - name: Renderer install
        run: npm ci --prefix renderers/remotion --ignore-scripts
      - name: Renderer tests
        run: npm test --prefix renderers/remotion

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync dependencies
        run: uv sync --frozen
      - *ffmpeg
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Blocked states in a browser
        run: uv run pytest -q -m e2e
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Renderer smoke and pixel goldens
        run: |
          npm ci --prefix renderers/remotion --ignore-scripts --no-audit --no-fund
          export REMOTION_CHROME="$(uv run python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')"
          npm run smoke --prefix renderers/remotion
          npm run pixels --prefix renderers/remotion
