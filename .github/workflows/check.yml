name: check

on:
  push:
    branches: [main]
    paths-ignore: &text-only
      - "docs/**"
      - ".opencode/**"
      - "README.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore: *text-only

# A newer push replaces a PR's run; every commit on main keeps its own.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q -n auto
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Frontend install
        run: npm ci --prefix frontend
      - name: Frontend tests and build
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Committed frontend build is current
        run: git diff --exit-code --stat -- frontend/dist
      - name: Renderer install
        run: npm ci --prefix renderers/remotion --ignore-scripts
      - name: Renderer tests
        run: npm test --prefix renderers/remotion
