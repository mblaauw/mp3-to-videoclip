name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    # The renderer resolves Avenir Next / documented macOS font fallbacks.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Ensure local render tools
        run: |
          brew install ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q
