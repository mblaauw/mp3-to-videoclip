[project]
name = "mp3-to-videoclip"
version = "0.1.0"
description = "Approval-gated, agent-operated music video preproduction"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "librosa>=0.11,<2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
]

[project.scripts]
clip = "mp3_to_videoclip.cli:main"
studio = "mp3_to_videoclip.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Agent instructions and skill docs are prompt material, not project code.
extend-exclude = [".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
